<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpendSense Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; font-family: 'Inter', -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; }
    .header { background: linear-gradient(135deg, #6366f1, #8b5cf6); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
    .header-icon { font-size: 1.4rem; }
    .header h1 { font-size: 0.95rem; font-weight: 700; }
    .header p { font-size: 0.7rem; opacity: 0.8; }
    .body { padding: 14px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { width: 100%; padding: 7px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #f1f5f9; font-size: 0.82rem; outline: none; }
    input:focus, select:focus { border-color: #6366f1; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn { width: 100%; padding: 9px; background: #6366f1; color: white; border: none; border-radius: 7px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: 4px; }
    .btn:hover { background: #4f46e5; }
    .btn:active { transform: scale(0.98); }
    .status { text-align: center; font-size: 0.75rem; margin-top: 8px; padding: 6px; border-radius: 5px; }
    .status.success { background: rgba(16,185,129,0.15); color: #10b981; }
    .status.error { background: rgba(239,68,68,0.15); color: #ef4444; }
    .status.hidden { display: none; }
    .footer { padding: 8px 14px; border-top: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .footer a { font-size: 0.7rem; color: #6366f1; text-decoration: none; }
    .server-url { font-size: 0.65rem; color: #475569; }
    .not-logged-in { padding: 20px; text-align: center; }
    .not-logged-in p { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; }
    .btn-outline { background: transparent; border: 1px solid #6366f1; color: #6366f1; }
  </style>
</head>
<body>
<div class="header">
  <span class="header-icon">💰</span>
  <div><h1>SpendSense Pro</h1><p>Quick Add Expense</p></div>
</div>

<div id="loginPrompt" class="not-logged-in hidden">
  <p>Sign in to SpendSense Pro to track expenses from any page.</p>
  <button class="btn" onclick="openDashboard()">Open SpendSense Pro</button>
</div>

<div id="addForm" class="body">
  <div class="row">
    <div class="form-group">
      <label>Amount (₹) *</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label>Date *</label>
      <input type="date" id="date">
    </div>
  </div>
  <div class="form-group">
    <label>Description</label>
    <input type="text" id="description" placeholder="What did you spend on?">
  </div>
  <div class="row">
    <div class="form-group">
      <label>Category *</label>
      <select id="category">
        <option value="Food">🍔 Food</option>
        <option value="Transport">🚗 Transport</option>
        <option value="Shopping">🛍️ Shopping</option>
        <option value="Bills">🧾 Bills</option>
        <option value="Health">🏥 Health</option>
        <option value="Education">📚 Education</option>
        <option value="Travel">✈️ Travel</option>
        <option value="Entertainment">🎬 Entertainment</option>
        <option value="Other">📦 Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Payment</label>
      <select id="payment">
        <option value="cash">Cash</option>
        <option value="card">Card</option>
        <option value="upi">UPI</option>
        <option value="net banking">Net Banking</option>
        <option value="wallet">Wallet</option>
      </select>
    </div>
  </div>
  <button class="btn" id="saveBtn" onclick="saveExpense()">+ Add Expense</button>
  <div id="status" class="status hidden"></div>
</div>

<div class="footer">
  <a href="#" onclick="openDashboard()">Open Dashboard →</a>
  <span class="server-url" id="serverDisplay"></span>
</div>

<script src="popup.js"></script>
</body>
</html>
